version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: compliance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-compliance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-compliance_password}
      POSTGRES_DB: ${POSTGRES_DB:-compliance_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-compliance_user} -d ${POSTGRES_DB:-compliance_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
